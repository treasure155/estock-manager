# Builds the signed Android APK and adds it to the GitHub release for the
# version in package.json. Called by release.yml, and can also be run on its
# own from the Actions tab ("Android APK" → Run workflow) without rebuilding
# or touching the Windows and Mac files.
name: Android APK

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the Android signing key is set up
        shell: bash
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSPW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS" ] || [ -z "$KSPW" ]; then
            echo "::error::GitHub secrets ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD are missing. See README, 'Keys and releases'."; exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub's Ubuntu machines already have the Android SDK; accept its
      # licences and use NDK 27 (or the newest NDK already installed).
      - name: Prepare the Android SDK and NDK
        shell: bash
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "ndk;27.0.11902837" > /dev/null || true
          if [ -d "$ANDROID_HOME/ndk/27.0.11902837" ]; then NDK="$ANDROID_HOME/ndk/27.0.11902837"; else NDK="$ANDROID_NDK_LATEST_HOME"; fi
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then echo "::error::No Android NDK found"; exit 1; fi
          echo "NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "Using NDK at $NDK"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      - name: Create the Android project
        run: npx tauri android init --ci

      - name: Sign with the eStock Android key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: node tools/android-signing.mjs

      - name: Build the APK
        run: npx tauri android build --apk --target aarch64 armv7

      - name: Name the APK
        id: apk
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*release*.apk" | head -n 1)
          if [ -z "$APK" ]; then echo "::error::No release APK was produced"; exit 1; fi
          cp "$APK" "eStock-Manager_${VERSION}_android.apk"
          echo "file=eStock-Manager_${VERSION}_android.apk" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Add the APK to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.tag }}
          files: ${{ steps.apk.outputs.file }}
          draft: false
          prerelease: false
