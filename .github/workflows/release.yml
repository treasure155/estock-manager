# Builds eStock Manager for Windows, macOS and Android on GitHub's machines and
# publishes the GitHub Release straight away (not a draft), including the
# signed update files that installed desktop copies download automatically.
# Each version must be released once: never "Re-run all jobs" on a published
# release (use "Re-run failed jobs"), or the update files stop matching.
#
# Trigger: `npm run release` (pushes a tag like v2.0.0), or run it by hand
# from the Actions tab.
name: Build and release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest          # one .dmg for Apple Silicon and Intel Macs
            args: --target universal-apple-darwin
          - platform: windows-latest        # .exe (NSIS) and .msi installers
            args: ''
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Check the signing keys are set up
        shell: bash
        env:
          UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if grep -q UNSET src-tauri/license_public_key.txt; then
            echo "::error::Licence public key missing. On the admin computer run: npm run setup-keys, then commit and push."; exit 1
          fi
          if grep -q '"pubkey": "UNSET"' src-tauri/tauri.conf.json; then
            echo "::error::Update public key missing. On the admin computer run: npm run setup-keys, then commit and push."; exit 1
          fi
          if [ -z "$UPDATER_KEY" ]; then
            echo "::error::GitHub secret TAURI_SIGNING_PRIVATE_KEY is missing. See README, 'Keys and releases'."; exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'eStock Manager v__VERSION__'
          releaseBody: |
            **Windows:** download the `.exe` (or `.msi`).
            **Mac:** download the `.dmg`.
            **Android:** download the file ending in `_android.apk` (added a few minutes after the others).
            Already using eStock Manager? It will offer this update by itself (Settings → Updates).
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }} --config src-tauri/tauri.updater.conf.json

  android:
    # Runs after the desktop installers so the release already exists.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the Android signing key is set up
        shell: bash
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSPW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS" ] || [ -z "$KSPW" ]; then
            echo "::error::GitHub secrets ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD are missing. See README, 'Keys and releases'."; exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install the Android NDK
        run: |
          sdkmanager "ndk;27.0.11902837"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.11902837" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      - name: Create the Android project
        run: npx tauri android init --ci

      - name: Sign with the eStock Android key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: node tools/android-signing.mjs

      - name: Build the APK
        run: npx tauri android build --apk --target aarch64 armv7

      - name: Name the APK
        id: apk
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*release*.apk" | head -n 1)
          if [ -z "$APK" ]; then echo "::error::No release APK was produced"; exit 1; fi
          cp "$APK" "eStock-Manager_${VERSION}_android.apk"
          echo "file=eStock-Manager_${VERSION}_android.apk" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Add the APK to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.tag }}
          files: ${{ steps.apk.outputs.file }}
          draft: false
          prerelease: false
